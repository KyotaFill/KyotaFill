<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">See you in the next build</title>
  <desc id="desc">Animated profile footer with a moving wave and twinkling lights.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.45" stop-color="#3b1c72"/>
      <stop offset="0.75" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#sky)"/>
  <path d="M0 20 C190 62 360 2 560 34 S920 65 1200 18 V0 H0Z" fill="#0d1117" fill-opacity=".58">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 20 C190 62 360 2 560 34 S920 65 1200 18 V0 H0Z;M0 34 C180 3 390 58 580 26 S930 5 1200 35 V0 H0Z;M0 20 C190 62 360 2 560 34 S920 65 1200 18 V0 H0Z"/>
  </path>
  <g fill="#fff">
    <circle cx="150" cy="82" r="1.8"><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="72" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="82" fill="#fff" stroke="#6e40c9" stroke-width="1" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700">SEE YOU IN THE NEXT BUILD</text>
</svg>
