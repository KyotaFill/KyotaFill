<svg xmlns="http://www.w3.org/2000/svg" width="760" height="58" viewBox="0 0 760 58" role="img" aria-labelledby="title desc">
  <title id="title">KyotaFill animated introduction</title>
  <desc id="desc">Four profile roles displayed in a repeating sequence.</desc>
  <rect width="760" height="58" rx="8" fill="#0d1117"/>
  <g fill="#8b5cf6" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="24" font-weight="600">
    <text x="380" y="38" opacity="1">AI/ML &amp; IoT Student<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.21;.24;.25;.49;.5;.74;.75;1"/></text>
    <text x="380" y="38" opacity="0">Computer Vision Builder<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0;0;0;0" keyTimes="0;.21;.24;.46;.49;.5;.74;.75;1"/></text>
    <text x="380" y="38" opacity="0">Turning Models into Products<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0;0;1;1;0;0;0" keyTimes="0;.21;.24;.46;.49;.71;.74;.75;1"/></text>
    <text x="380" y="38" opacity="0">Learning. Building. Improving.<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0;0;0;0;1;1;0" keyTimes="0;.21;.24;.46;.49;.71;.74;.96;1"/></text>
  </g>
  <rect x="542" y="17" width="3" height="27" fill="#8b5cf6"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
</svg>
